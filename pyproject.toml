[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tn-dashboard"
version = "0.1.0"
description = "Tunisia socioeconomic dashboard: ETL over the INS data portal + a Streamlit app"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "geopandas>=0.14",
    "unidecode>=1.3",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.35",
    "folium>=0.16",
    "streamlit-folium>=0.21",
    "plotly>=5.20",
]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tn_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "app", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
