name: Refresh data

on:
  schedule:
    - cron: "0 3 * * 1"  # weekly, Monday 03:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (geopandas needs GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev

      - name: Install package
        run: pip install -e ".[app]"

      - name: Run ETL job
        run: python scripts/run_etl.py

      - name: Commit refreshed database if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tunisia.duckdb data/raw/ins_catalog/
          git diff --cached --quiet || git commit -m "Scheduled data refresh"
          git push
